<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>钢琴调律助手</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>钢琴调律助手</h1>
        <div class="header-controls">
          <label class="ctrl">
            A4
            <input id="a4-input" type="number" min="420" max="460" step="0.1" value="440" />
            Hz
          </label>
          <label class="ctrl">
            律制
            <select id="temperament-select"></select>
          </label>
          <label class="ctrl">
            八度
            <select id="octave-select">
              <option value="4:2">4:2（标准）</option>
              <option value="6:3">6:3（明亮）</option>
              <option value="2:1">2:1（微拉伸）</option>
            </select>
          </label>
          <label class="ctrl switch">
            <input id="demo-toggle" type="checkbox" checked />
            演示模式
          </label>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-view="pianos">钢琴档案</button>
        <button class="tab" data-view="measure">逐音测量</button>
        <button class="tab" data-view="stretch">拉伸曲线</button>
        <button class="tab" data-view="tune">调律模式</button>
        <button class="tab" data-view="records">工作记录</button>
      </nav>

      <main>
        <section id="view-pianos" class="view active"></section>
        <section id="view-measure" class="view"></section>
        <section id="view-stretch" class="view"></section>
        <section id="view-tune" class="view"></section>
        <section id="view-records" class="view"></section>
      </main>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
